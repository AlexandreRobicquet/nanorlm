name: Verifiers upstream compatibility

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifiers-upstream-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  current-upstream:
    name: current-upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out nanoRLM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
          enable-cache: true
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Clone current Verifiers
        run: git clone --depth 1 https://github.com/PrimeIntellect-ai/verifiers.git /tmp/nanorlm-verifiers-current

      - name: Check current upstream compatibility
        run: uv run python scripts/check_verifiers_compatibility.py --repo-root /tmp/nanorlm-verifiers-current
