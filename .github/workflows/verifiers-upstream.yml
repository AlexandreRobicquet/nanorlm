name: Verifiers upstream compatibility

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifiers-upstream-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  current-upstream:
    name: current-upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out nanoRLM
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Clone current Verifiers
        run: git clone --depth 1 https://github.com/PrimeIntellect-ai/verifiers.git /tmp/nanorlm-verifiers-current

      - name: Check current upstream compatibility
        run: uv run python scripts/check_verifiers_compatibility.py --repo-root /tmp/nanorlm-verifiers-current
