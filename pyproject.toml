[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanorlm"
version = "0.2.0"
description = "Cited repository answers and a compact recursive retention research engine."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Alexandre Robicquet" }
]
license = "MIT"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<9.2",
]

[tool.uv]
package = false

[tool.setuptools]
packages = []
py-modules = []
